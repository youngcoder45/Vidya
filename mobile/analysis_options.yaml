include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    # Theme rule: raw Color constructors are only allowed in the tokens layer.
    # Enforced via a custom lint in CI; here we treat it as a warning for devs.
    avoid_hardcoded_colors: warning

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - always_declare_return_types
    - avoid_print
